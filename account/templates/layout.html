{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'account/css/layout.css' %}">
    {% block styles %}{% endblock %}
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <header class="container">
    <a class="logo" href="{% url 'products' %}">
        NEXTTECH
    </a>
    <div class="search-block">
        <input class="site-search input-field" placeholder="Site search...">
        <img class="search-icon" src="{% static 'shop/images/search.svg' %}"></img>
    </div>
    <div class="widgets-block">
        <a class="widget-btn">
            <img class="widget-icon" src="{% static 'shop/images/hurt.svg' %}"></img>
        </a>
        <a class="widget-btn">
            <img src="{% static 'shop/images/cart.svg' %}"></img>
        </a>
        <a class="widget-btn" href="/account">
            <img src="{% static 'shop/images/profile.svg' %}"></img>
        </a>
    </div>
</header>
    {% block content %}{% endblock %}
</body>
{% block scripts %}{% endblock %}
</html>
