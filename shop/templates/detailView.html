{% extends './layout.html' %}
{% load static %}

{% block styles %}<link rel="stylesheet" href="{% static 'shop/css/detailView.css' %}">{% endblock %}

{% block title %}{{ product.title }}{% endblock %}

{% block content %}
    <div class="container">
        <div class="title-container">
            <h1 class="page-title">Buy {{ product.title }}</h1>
            <p class="price-title">From {{ product.price }}₴</p>
        </div>
        <div class="content-block">
            <div class="image-container">
                {{ product.title }} image
            </div>
            <div class="info-block">
                Some info about {{ product.title }}
                </br>
                TODO
            </div>
        </div>
    </div>
{% endblock %}
